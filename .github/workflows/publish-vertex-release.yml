name: Publish signed Vertex release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable GitHub Release tag (for example v1.1.0-rc.1)
        required: true
        type: string
      platform_tag:
        description: Exact XRIG Platform tag used to build the verifier
        required: true
        type: string
      vertex_tag:
        description: Exact Vertex source tag to package
        required: true
        type: string
      kai_compatibility_tag:
        description: Kai compatibility metadata only; Kai is not built or published
        required: true
        type: string
      prerelease:
        description: Publish a -rc.* candidate (must agree with release_tag and vertex_tag)
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: xrig-vertex-release-${{ inputs.release_tag }}
  cancel-in-progress: false

# Vertex ships for Linux only. Its app-only release contract: the Ubuntu .deb is
# signed and listed in xrig-release-v1.manifest, and install-vertex-linux.sh is
# the unsigned public bootstrap. Runtime stacks and models are signed and
# published independently. The Windows sources stay in Vertex but are neither
# built nor published.
jobs:
  validate:
    name: Validate release contract and inputs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.versions.outputs.release }}
      platform: ${{ steps.versions.outputs.platform }}
      vertex: ${{ steps.versions.outputs.vertex }}
      kai: ${{ steps.versions.outputs.kai }}
      channel: ${{ steps.versions.outputs.channel }}
    steps:
      - name: Check out release orchestration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate Vertex release workflow contract
        shell: pwsh
        run: |
          ./scripts/Test-PublishVertexReleaseWorkflow.ps1
          ./scripts/Test-NewVertexReleaseManifest.ps1

      - name: Validate inputs
        id: versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Convert-TagToVersion([string]$value, [string]$name) {
            if ($value -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$') { throw "$name must be a v-prefixed SemVer tag." }
            return $Matches[1]
          }
          $release = Convert-TagToVersion '${{ inputs.release_tag }}' 'release_tag'
          $platform = Convert-TagToVersion '${{ inputs.platform_tag }}' 'platform_tag'
          $vertex = Convert-TagToVersion '${{ inputs.vertex_tag }}' 'vertex_tag'
          $kai = Convert-TagToVersion '${{ inputs.kai_compatibility_tag }}' 'kai_compatibility_tag'
          $isCandidate = $release -match '-rc\.[0-9]+$'
          if ($release -ne $vertex) { throw 'release_tag and vertex_tag must identify the same Vertex version.' }
          if ((('${{ inputs.prerelease }}' -eq 'true')) -ne $isCandidate) { throw 'prerelease must be true only for a -rc.N release_tag.' }
          # The manifest signs its channel, and the bootstrap accepts only
          # "candidate" for a pinned release root and "stable" for latest.
          $channel = if ($isCandidate) { 'candidate' } else { 'stable' }
          "release=$release" >> $env:GITHUB_OUTPUT
          "platform=$platform" >> $env:GITHUB_OUTPUT
          "vertex=$vertex" >> $env:GITHUB_OUTPUT
          "kai=$kai" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

  release:
    name: Build, sign, and publish Vertex for Linux
    needs: validate
    # Ubuntu 24.04 is the package's glibc baseline.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      PLATFORM_VERSION: ${{ needs.validate.outputs.platform }}
      VERTEX_VERSION: ${{ needs.validate.outputs.vertex }}
      KAI_VERSION: ${{ needs.validate.outputs.kai }}
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
    steps:
      - name: Check out release orchestration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate protected configuration
        shell: bash
        env:
          XRIG_SOURCE_READ_TOKEN: ${{ secrets.XRIG_SOURCE_READ_TOKEN }}
          XRIG_RELEASE_SIGNING_PKCS8_B64: ${{ secrets.XRIG_RELEASE_SIGNING_PKCS8_B64 }}
          SUPABASE_ANON_KEY: ${{ vars.XRIG_SUPABASE_ANON_KEY }}
          ACTIVATION_RESPONSE_PUBLIC_KEY_HEX: ${{ vars.XRIG_ACTIVATION_RESPONSE_PUBLIC_KEY_HEX }}
        run: |
          set -euo pipefail
          for name in XRIG_SOURCE_READ_TOKEN XRIG_RELEASE_SIGNING_PKCS8_B64 SUPABASE_ANON_KEY ACTIVATION_RESPONSE_PUBLIC_KEY_HEX; do
            [[ -n "${!name}" ]] || { echo "$name is not configured in the production environment." >&2; exit 1; }
          done

      - name: Check out tagged XRIG Platform source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: xrigpc/xrig-platform
          ref: ${{ inputs.platform_tag }}
          token: ${{ secrets.XRIG_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: src/platform

      - name: Check out tagged Vertex source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: xrigpc/xrig-llama-backend
          ref: ${{ inputs.vertex_tag }}
          token: ${{ secrets.XRIG_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: src/vertex

      - name: Confirm immutable source tags
        shell: bash
        run: |
          set -euo pipefail
          assert_exact_tag() {
            local path="$1" expected="$2" label="$3" actual
            actual="$(git -C "$path" describe --tags --exact-match)"
            [[ "$actual" == "$expected" ]] || { echo "$label is checked out at $actual, not requested tag $expected." >&2; exit 1; }
            echo "${label^^}_SHA=$(git -C "$path" rev-parse HEAD)" >> "$GITHUB_ENV"
          }
          assert_exact_tag src/platform '${{ inputs.platform_tag }}' platform
          assert_exact_tag src/vertex '${{ inputs.vertex_tag }}' vertex

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/vertex/.go-version
          cache-dependency-path: |
            src/vertex/go.sum
            src/platform/go.sum

      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: src/vertex/.node-version
          cache: npm
          # Vertex 1.1.0-rc.7 renamed cmd/xrig-app to cmd/vertex-app.
          cache-dependency-path: src/vertex/cmd/*-app/frontend/package-lock.json

      - name: Ubuntu baseline native GUI dependencies
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build XRIG Platform release tooling
        shell: pwsh
        env:
          SUPABASE_ANON_KEY: ${{ vars.XRIG_SUPABASE_ANON_KEY }}
          ACTIVATION_RESPONSE_PUBLIC_KEY_HEX: ${{ vars.XRIG_ACTIVATION_RESPONSE_PUBLIC_KEY_HEX }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path tools, artifacts | Out-Null
          Push-Location src/platform
          try {
            go test ./identity ./release ./cmd/xrig-identity
            ./scripts/build-xrig-identity.ps1 -Version $env:PLATFORM_VERSION -SupabaseAnonKey $env:SUPABASE_ANON_KEY -ActivationResponsePublicKeyHex $env:ACTIVATION_RESPONSE_PUBLIC_KEY_HEX -OutputPath "$env:GITHUB_WORKSPACE/tools/xrig-identity"
            go build -trimpath -o "$env:GITHUB_WORKSPACE/tools/xrig-keytool" ./cmd/xrig-keytool
          }
          finally { Pop-Location }

      - name: Prove release-key coherence with XRIG Platform
        shell: bash
        env:
          XRIG_RELEASE_SIGNING_PKCS8_B64: ${{ secrets.XRIG_RELEASE_SIGNING_PKCS8_B64 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/xrig-release-signing.key"
          probe="$RUNNER_TEMP/xrig-release-key-coherence.bin"
          trap 'rm -f "$key" "$probe" "$probe.sig"' EXIT
          printf '%s' "$XRIG_RELEASE_SIGNING_PKCS8_B64" | base64 -d > "$key"
          printf '%s' 'XRIG release-key coherence v1' > "$probe"
          tools/xrig-keytool sign --private-key "$key" --file "$probe" --signature "$probe.sig" || { echo 'Could not sign the release-key coherence probe.' >&2; exit 1; }
          tools/xrig-identity --mode verify-artifact --file "$probe" --signature "$probe.sig" --sha256 "$(sha256sum "$probe" | awk '{print $1}')" --json >/dev/null ||
            { echo 'The CI release key does not match the XRIG Platform embedded release public key.' >&2; exit 1; }

      - name: Test and build the Ubuntu package
        working-directory: src/vertex
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          [[ -z "$unformatted" ]] || { echo "gofmt required on: $unformatted" >&2; exit 1; }
          go vet ./...
          go test ./...
          # Vertex 1.1.0-rc.7 renamed cmd/xrig-app to cmd/vertex-app; earlier
          # tags keep building from the old directory.
          app_dir=cmd/vertex-app
          [[ -d "$app_dir" ]] || app_dir=cmd/xrig-app
          npm ci --prefix "$app_dir/frontend"
          npm test --prefix "$app_dir/frontend" -- --run
          bash scripts/build-linux-gui.sh
          # The GUI embeds frontend/dist, which the build above produced.
          go test -tags xrigapp,webkit2_41 "./$app_dir" -count=1
          bash scripts/build-linux-deb.sh "$VERTEX_VERSION"
          deb="dist/xrig-vertex_${VERTEX_VERSION}_amd64.deb"
          [[ "$(dpkg-deb --field "$deb" Package)" == xrig-vertex ]] || { echo 'unexpected package name' >&2; exit 1; }
          [[ "$(dpkg-deb --field "$deb" Version)" == "${VERTEX_VERSION/-/\~}" ]] || { echo 'package version does not match the release' >&2; exit 1; }
          [[ "$(dpkg-deb --field "$deb" Architecture)" == amd64 ]] || { echo 'package is not amd64' >&2; exit 1; }
          dpkg-deb --contents "$deb"
          cp "$deb" "$GITHUB_WORKSPACE/artifacts/"
          cp scripts/bootstrap-linux.sh "$GITHUB_WORKSPACE/artifacts/install-vertex-linux.sh"

      - name: Validate Vertex artifact inventory
        shell: bash
        run: |
          set -euo pipefail
          deb="xrig-vertex_${VERTEX_VERSION}_amd64.deb"
          present="$(cd artifacts && ls -1 | LC_ALL=C sort | paste -sd, -)"
          expected="$(printf '%s\n' install-vertex-linux.sh "$deb" | LC_ALL=C sort | paste -sd, -)"
          [[ "$present" == "$expected" ]] || { echo "Unexpected Vertex release inventory: $present" >&2; exit 1; }
          for name in install-vertex-linux.sh "$deb"; do
            [[ -s "artifacts/$name" ]] || { echo "Empty Vertex release artifact: $name" >&2; exit 1; }
          done
          [[ "$(head -c 21 "artifacts/$deb")" == $'!<arch>\ndebian-binary' ]] || { echo 'Expected a Debian package for the Ubuntu asset.' >&2; exit 1; }
          bootstrap=artifacts/install-vertex-linux.sh
          if grep -Eq 'Pallav0099|supabase\.co/storage' "$bootstrap" || ! grep -Fq 'xrigpc/xrig-releases/releases/' "$bootstrap"; then
            echo 'install-vertex-linux.sh is not bound to the canonical XRIG GitHub Releases channel.' >&2; exit 1
          fi
          if grep -q $'\r' "$bootstrap"; then echo 'install-vertex-linux.sh must use LF line endings.' >&2; exit 1; fi

      - name: Sign, generate, and verify the canonical Vertex manifest
        shell: bash
        env:
          XRIG_RELEASE_SIGNING_PKCS8_B64: ${{ secrets.XRIG_RELEASE_SIGNING_PKCS8_B64 }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/xrig-release-signing.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$XRIG_RELEASE_SIGNING_PKCS8_B64" | base64 -d > "$key"
          # The public bootstrap stays unsigned: it changes nothing until
          # Platform has verified the signed manifest and the package.
          deb="artifacts/xrig-vertex_${VERTEX_VERSION}_amd64.deb"
          tools/xrig-keytool sign --private-key "$key" --file "$deb" --signature "$deb.sig" || { echo "Signing failed: $deb" >&2; exit 1; }
          pwsh -NoProfile -File scripts/New-VertexReleaseManifest.ps1 -ReleaseTag '${{ inputs.release_tag }}' -PlatformVersion "$PLATFORM_VERSION" -VertexVersion "$VERTEX_VERSION" -KaiCompatibilityVersion "$KAI_VERSION" -Channel "$RELEASE_CHANNEL" -AssetDirectory artifacts -OutputPath artifacts/xrig-release-v1.manifest
          manifest=artifacts/xrig-release-v1.manifest
          tools/xrig-keytool sign --private-key "$key" --file "$manifest" --signature "$manifest.sig" || { echo 'Signing failed: xrig-release-v1.manifest' >&2; exit 1; }
          verified="$(tools/xrig-identity --mode verify-release --manifest "$manifest" --signature "$manifest.sig" --json)" ||
            { echo 'XRIG Platform rejected the generated Vertex release manifest.' >&2; exit 1; }
          [[ "$(jq -r .channel <<<"$verified")" == "$RELEASE_CHANNEL" && "$(jq -r .vertex_version <<<"$verified")" == "$VERTEX_VERSION" ]] ||
            { echo 'XRIG Platform verified an unexpected channel or version.' >&2; exit 1; }
          # Prove every signed payload exactly as the installer will.
          while IFS='=' read -r field name; do
            id="${field#asset.}"; id="${id%.path}"
            hash="$(awk -F= -v key="asset.$id.sha256" '$1 == key { print $2 }' "$manifest")"
            tools/xrig-identity --mode verify-artifact --file "artifacts/$name" --signature "artifacts/$name.sig" --sha256 "$hash" --json >/dev/null ||
              { echo "XRIG Platform rejected signed asset $id ($name)." >&2; exit 1; }
          done < <(grep -E '^asset\.[^=]+\.path=' "$manifest")
          if find artifacts -type f -size +2097151k | grep -q .; then echo 'A GitHub Release asset reached the 2 GiB per-file limit.' >&2; exit 1; fi

      - name: Publish immutable GitHub Release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          existing="$(gh release list --repo xrigpc/xrig-releases --limit 1000 --json tagName --jq '.[].tagName')" ||
            { echo 'Could not query existing GitHub Releases.' >&2; exit 1; }
          if grep -Fxq "$tag" <<<"$existing"; then
            echo "GitHub Release $tag already exists. Immutable release assets must not be replaced." >&2; exit 1
          fi
          manifest_hash="$(sha256sum artifacts/xrig-release-v1.manifest | awk '{print $1}')"
          download="https://github.com/xrigpc/xrig-releases/releases/download/$tag"
          if [[ "$RELEASE_CHANNEL" == candidate ]]; then
            install="Install this candidate on Ubuntu (it is never served as latest):
          \`curl -fsSL $download/install-vertex-linux.sh | XRIG_VERTEX_RELEASE_ROOT=$download bash\`"
          else
            install="Install on Ubuntu:
          \`curl -fsSL https://github.com/xrigpc/xrig-releases/releases/latest/download/install-vertex-linux.sh | bash\`"
          fi
          cat > "$RUNNER_TEMP/RELEASE_NOTES.md" <<NOTES
          # XRIG Vertex $RELEASE_VERSION

          Source locks:
          - Platform: ${{ inputs.platform_tag }} ($PLATFORM_SHA)
          - Vertex: ${{ inputs.vertex_tag }} ($VERTEX_SHA)
          - Kai compatibility metadata: ${{ inputs.kai_compatibility_tag }}

          Channel: $RELEASE_CHANNEL
          Manifest SHA-256: $manifest_hash

          $install

          This release contains only the Vertex application for Linux (Ubuntu). Runtime
          stacks and models are versioned and signed separately. XRIG Platform verifies
          every payload locally before use.
          NOTES
          # Upload into a draft so no partial release is ever public, prove the
          # inventory, then publish.
          args=(release create "$tag" --repo xrigpc/xrig-releases --target "$GITHUB_SHA" --draft --title "XRIG Vertex $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md")
          [[ "$RELEASE_CHANNEL" == candidate ]] && args+=(--prerelease)
          gh "${args[@]}" artifacts/* || { echo 'GitHub draft release creation failed.' >&2; exit 1; }
          expected="$(cd artifacts && for f in *; do printf '%s %s\n' "$f" "$(stat -c %s "$f")"; done | LC_ALL=C sort)"
          actual="$(gh release view "$tag" --repo xrigpc/xrig-releases --json assets --jq '.assets[] | "\(.name) \(.size)"' | LC_ALL=C sort)"
          [[ "$expected" == "$actual" ]] || { echo 'Draft GitHub Release assets do not match the signed inventory; the draft was left unpublished.' >&2; exit 1; }
          publish=(release edit "$tag" --repo xrigpc/xrig-releases --draft=false)
          [[ "$RELEASE_CHANNEL" == stable ]] && publish+=(--latest)
          gh "${publish[@]}" || { echo 'Publishing the verified draft release failed.' >&2; exit 1; }

      - name: Verify published asset inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh release view '${{ inputs.release_tag }}' --repo xrigpc/xrig-releases --json isDraft,isPrerelease,assets)"
          [[ "$(jq -r .isDraft <<<"$release")" == false ]] || { echo 'The release is still a draft.' >&2; exit 1; }
          candidate=false; [[ "$RELEASE_CHANNEL" == candidate ]] && candidate=true
          [[ "$(jq -r .isPrerelease <<<"$release")" == "$candidate" ]] || { echo 'The release pre-release flag does not match its signed channel.' >&2; exit 1; }
          expected="$(cd artifacts && for f in *; do printf '%s %s\n' "$f" "$(stat -c %s "$f")"; done | LC_ALL=C sort)"
          actual="$(jq -r '.assets[] | "\(.name) \(.size)"' <<<"$release" | LC_ALL=C sort)"
          count="$(jq '.assets | length' <<<"$release")"
          [[ "$count" == 5 ]] || { echo "Expected 5 published Vertex assets, found $count." >&2; exit 1; }
          [[ "$expected" == "$actual" ]] || { echo 'Published GitHub Release assets do not match the signed inventory.' >&2; exit 1; }
