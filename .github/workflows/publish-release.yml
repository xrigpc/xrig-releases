name: Publish signed Kai release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable GitHub Release tag (for example v1.0.2-rc.1)
        required: true
        type: string
      platform_tag:
        description: Exact XRIG Platform tag used to build the verifier
        required: true
        type: string
      vertex_tag:
        description: Existing Vertex compatibility tag; it is not rebuilt in a Kai-only release
        required: true
        type: string
      kai_tag:
        description: Exact Kai source tag to package
        required: true
        type: string
      prerelease:
        description: Publish a -rc.* candidate (must agree with release_tag and kai_tag)
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: xrig-kai-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign, and publish Kai
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 75
    environment: production
    env:
      XRIG_SOURCE_READ_TOKEN: ${{ secrets.XRIG_SOURCE_READ_TOKEN }}
      XRIG_RELEASE_SIGNING_PKCS8_B64: ${{ secrets.XRIG_RELEASE_SIGNING_PKCS8_B64 }}
      SUPABASE_ANON_KEY: ${{ vars.XRIG_SUPABASE_ANON_KEY }}
      ACTIVATION_RESPONSE_PUBLIC_KEY_HEX: ${{ vars.XRIG_ACTIVATION_RESPONSE_PUBLIC_KEY_HEX }}
    steps:
      - name: Check out release orchestration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate release workflow contract
        shell: pwsh
        run: |
          ./scripts/Test-PublishReleaseWorkflow.ps1
          ./scripts/Test-NewXrigReleaseManifest.ps1
          ./scripts/Test-NewKaiInstallBootstrap.ps1

      - name: Validate inputs and protected configuration
        id: versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('XRIG_SOURCE_READ_TOKEN', 'XRIG_RELEASE_SIGNING_PKCS8_B64', 'SUPABASE_ANON_KEY', 'ACTIVATION_RESPONSE_PUBLIC_KEY_HEX')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "$name is not configured in the production environment." }
          }
          function Convert-TagToVersion([string]$value, [string]$name) {
            if ($value -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$') { throw "$name must be a v-prefixed SemVer tag." }
            return $Matches[1]
          }
          $release = Convert-TagToVersion '${{ inputs.release_tag }}' 'release_tag'
          "platform=$(Convert-TagToVersion '${{ inputs.platform_tag }}' 'platform_tag')" >> $env:GITHUB_OUTPUT
          "vertex=$(Convert-TagToVersion '${{ inputs.vertex_tag }}' 'vertex_tag')" >> $env:GITHUB_OUTPUT
          $kai = Convert-TagToVersion '${{ inputs.kai_tag }}' 'kai_tag'
          $isCandidate = $release -match '-rc\.[0-9]+$'
          if ($release -ne $kai) { throw 'release_tag and kai_tag must identify the same Kai version.' }
          if ((('${{ inputs.prerelease }}' -eq 'true')) -ne $isCandidate) { throw 'prerelease must be true only for a -rc.N release_tag.' }
          "release=$release" >> $env:GITHUB_OUTPUT
          "kai=$kai" >> $env:GITHUB_OUTPUT

      - name: Check out tagged XRIG Platform source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: xrigpc/xrig-platform
          ref: ${{ inputs.platform_tag }}
          token: ${{ secrets.XRIG_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: src/platform

      - name: Check out tagged Kai source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: xrigpc/kai
          ref: ${{ inputs.kai_tag }}
          token: ${{ secrets.XRIG_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: src/kai

      - name: Confirm immutable source tags
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-ExactTag([string]$path, [string]$expected, [string]$label) {
            $actual = (git -C $path describe --tags --exact-match).Trim()
            if ($actual -ne $expected) { throw "$label is checked out at $actual, not requested tag $expected." }
            "$($label.ToUpperInvariant())_SHA=$((git -C $path rev-parse HEAD).Trim())" >> $env:GITHUB_ENV
          }
          Assert-ExactTag 'src/platform' '${{ inputs.platform_tag }}' 'platform'
          Assert-ExactTag 'src/kai' '${{ inputs.kai_tag }}' 'kai'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: src/platform/go.mod

      - name: Set up Node.js 22.23.1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.1

      - name: Set up CPython 3.12.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12.10
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: 0.8.22
          enable-cache: false

      - name: Build XRIG Platform release tooling
        shell: pwsh
        env:
          PLATFORM_VERSION: ${{ steps.versions.outputs.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path tools, artifacts | Out-Null
          Push-Location src/platform
          try {
            go test ./identity ./release ./cmd/xrig-identity
            ./scripts/build-xrig-identity.ps1 -Version $env:PLATFORM_VERSION -SupabaseAnonKey $env:SUPABASE_ANON_KEY -ActivationResponsePublicKeyHex $env:ACTIVATION_RESPONSE_PUBLIC_KEY_HEX -OutputPath "$env:GITHUB_WORKSPACE\tools\xrig-identity.exe"
            go build -trimpath -o "$env:GITHUB_WORKSPACE\tools\xrig-keytool.exe" ./cmd/xrig-keytool
          }
          finally { Pop-Location }

      - name: Prove release-key coherence with XRIG Platform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = Join-Path $env:RUNNER_TEMP 'xrig-release-signing.key'
          $probe = Join-Path $env:RUNNER_TEMP 'xrig-release-key-coherence.bin'
          $signature = "$probe.sig"
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:XRIG_RELEASE_SIGNING_PKCS8_B64))
            [IO.File]::WriteAllBytes($probe, [Text.Encoding]::UTF8.GetBytes('XRIG release-key coherence v1'))
            & tools\xrig-keytool.exe sign --private-key $key --file $probe --signature $signature
            if ($LASTEXITCODE -ne 0) { throw 'Could not sign the release-key coherence probe.' }
            $hash = (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash.ToLowerInvariant()
            & tools\xrig-identity.exe --mode verify-artifact --file $probe --signature $signature --sha256 $hash --json | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'The CI release key does not match the XRIG Platform embedded release public key.' }
          }
          finally { Remove-Item -LiteralPath $key, $probe, $signature -Force -ErrorAction SilentlyContinue }

      - name: Build and inspect tagged Kai package
        shell: pwsh
        env:
          KAI_VERSION: ${{ steps.versions.outputs.kai }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location src/kai
          try {
            npm ci --workspace apps/desktop --workspace apps/shared
            node scripts/check-kai-product-dependencies.cjs
            uv sync --locked --project integrations/kai-document-search --python 3.12
            uv run --project integrations/kai-document-search python -W error::RuntimeWarning -c "from kai_document_search import server; print('Kai document-search imports passed.')"
            uv run --project integrations/kai-document-search python -W error::RuntimeWarning -m unittest discover -s integrations/kai-document-search/tests -v
            uv sync --locked --extra dev --python 3.12
            npm run typecheck --workspace apps/desktop
            node --test apps/desktop/electron/kai-runtime-stage.test.cjs apps/desktop/electron/kai-product-main.test.cjs apps/desktop/electron/xrig-identity.test.cjs apps/desktop/electron/vertex-runtime.test.cjs apps/desktop/electron/windows-child-process.test.cjs
            npm run test:ui --workspace apps/desktop -- src/app/settings/providers-settings.test.tsx src/app/messaging/whatsapp-allowlist-editor.test.tsx
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-kai-product-policy.ps1
            npm run dist:win:nsis --workspace apps/desktop -- --publish never
            $expectedPackageName = "Kai-$env:KAI_VERSION-win-x64.exe"
            $package = @(Get-ChildItem -LiteralPath "apps/desktop/release/$expectedPackageName" -File)
            if ($package.Count -ne 1) { throw "Expected Kai NSIS package: $expectedPackageName" }
            $runtime = 'apps/desktop/release/win-unpacked/resources/kai-runtime/backend'
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-kai-product-policy.ps1 -RuntimeRoot $runtime
            uv run python scripts/test-kai-runtime-route-policy.py --runtime-root $runtime
            node apps/desktop/scripts/check-kai-package-policy.cjs apps/desktop/release/win-unpacked/resources/app.asar
            foreach ($required in @("$runtime/scripts/provision-kai.ps1", 'apps/desktop/release/win-unpacked/resources/kai-windows-x64.lock.json')) {
              if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Kai package is missing $required." }
            }
            if (Test-Path -LiteralPath "$runtime/scripts/install.ps1" -PathType Leaf) { throw 'Kai package contains the obsolete public installer.' }
            Copy-Item $package[0].FullName "$env:GITHUB_WORKSPACE\artifacts\$expectedPackageName" -Force
          }
          finally { Pop-Location }

      - name: Generate source lock and public Kai bootstrap
        shell: pwsh
        env:
          KAI_VERSION: ${{ steps.versions.outputs.kai }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = [ordered]@{
            format = 'xrig-source-lock-v1'
            release_tag = '${{ inputs.release_tag }}'
            platform = [ordered]@{ tag = '${{ inputs.platform_tag }}'; sha = $env:PLATFORM_SHA }
            vertex_compatibility_tag = '${{ inputs.vertex_tag }}'
            kai = [ordered]@{ tag = '${{ inputs.kai_tag }}'; sha = $env:KAI_SHA }
          }
          $lock | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath artifacts\source-lock.json -Encoding utf8
          $channel = if ('${{ inputs.prerelease }}' -eq 'true') { 'candidate' } else { 'stable' }
          ./scripts/New-KaiInstallBootstrap.ps1 -ReleaseTag '${{ inputs.release_tag }}' -KaiVersion $env:KAI_VERSION -Channel $channel -OutputPath artifacts\Install-Kai.ps1

      - name: Sign Kai release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = Join-Path $env:RUNNER_TEMP 'xrig-release-signing.key'
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:XRIG_RELEASE_SIGNING_PKCS8_B64))
            foreach ($artifact in @(Get-ChildItem artifacts -File)) {
              & tools\xrig-keytool.exe sign --private-key $key --file $artifact.FullName --signature "$($artifact.FullName).sig"
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($artifact.Name)" }
            }
          }
          finally { Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue }

      - name: Generate and verify canonical Kai manifest
        shell: pwsh
        env:
          PLATFORM_VERSION: ${{ steps.versions.outputs.platform }}
          VERTEX_VERSION: ${{ steps.versions.outputs.vertex }}
          KAI_VERSION: ${{ steps.versions.outputs.kai }}
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = if ('${{ inputs.prerelease }}' -eq 'true') { 'candidate' } else { 'stable' }
          ./scripts/New-XrigReleaseManifest.ps1 -ReleaseTag '${{ inputs.release_tag }}' -PlatformVersion $env:PLATFORM_VERSION -VertexVersion $env:VERTEX_VERSION -KaiVersion $env:KAI_VERSION -Channel $channel -AssetDirectory artifacts -OutputPath artifacts\xrig-release-v1.manifest
          $key = Join-Path $env:RUNNER_TEMP 'xrig-release-signing.key'
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:XRIG_RELEASE_SIGNING_PKCS8_B64))
            & tools\xrig-keytool.exe sign --private-key $key --file artifacts\xrig-release-v1.manifest --signature artifacts\xrig-release-v1.manifest.sig
            if ($LASTEXITCODE -ne 0) { throw 'Signing failed: xrig-release-v1.manifest' }
          }
          finally { Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue }
          & tools\xrig-identity.exe --mode verify-release --manifest artifacts\xrig-release-v1.manifest --signature artifacts\xrig-release-v1.manifest.sig --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'XRIG Platform rejected the generated release manifest.' }

      - name: Create signed checksums and validate release inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unsigned = Get-ChildItem artifacts -File | Where-Object { $_.Name -notmatch '\.sig$|^SHA256SUMS\.txt$' }
          $artifactRoot = (Resolve-Path artifacts).Path.TrimEnd('\\')
          $unsigned | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $($_.Path.Substring($artifactRoot.Length).TrimStart('\\'))"
          } | Set-Content -LiteralPath artifacts\SHA256SUMS.txt -Encoding ascii
          $key = Join-Path $env:RUNNER_TEMP 'xrig-release-signing.key'
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:XRIG_RELEASE_SIGNING_PKCS8_B64))
            & tools\xrig-keytool.exe sign --private-key $key --file artifacts\SHA256SUMS.txt --signature artifacts\SHA256SUMS.txt.sig
            if ($LASTEXITCODE -ne 0) { throw 'Signing failed: SHA256SUMS.txt' }
          }
          finally { Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue }
          foreach ($file in Get-ChildItem artifacts -File) {
            if ($file.Length -lt 1) { throw "Empty release file: $($file.Name)" }
            if ($file.Length -ge 2GB) { throw "GitHub Release asset exceeds the 2 GiB limit: $($file.Name)" }
          }

      - name: Publish immutable GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.versions.outputs.release }}
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = @(& gh release list --repo xrigpc/xrig-releases --limit 1000 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Could not query existing GitHub Releases.' }
          if ($existing -contains '${{ inputs.release_tag }}') { throw "Release ${{ inputs.release_tag }} already exists; immutable assets cannot be replaced." }
          $manifestHash = (Get-FileHash -LiteralPath artifacts\xrig-release-v1.manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          # XRIG Kai $env:RELEASE_VERSION

          Source locks:
          - Platform: ${{ inputs.platform_tag }} ($env:PLATFORM_SHA)
          - Vertex compatibility: ${{ inputs.vertex_tag }}
          - Kai: ${{ inputs.kai_tag }} ($env:KAI_SHA)

          Manifest SHA-256: $manifestHash

          The unsigned Windows installer is validated locally by XRIG Platform identity verification plus Ed25519 signatures and SHA-256 before installation.
          "@ | Set-Content -LiteralPath artifacts\RELEASE_NOTES.md -Encoding utf8
          $args = @('release', 'create', '${{ inputs.release_tag }}', '--repo', 'xrigpc/xrig-releases', '--title', "XRIG Kai $env:RELEASE_VERSION", '--notes-file', 'artifacts\RELEASE_NOTES.md')
          if ('${{ inputs.prerelease }}' -eq 'true') { $args += '--prerelease' }
          $args += @(Get-ChildItem artifacts -File | Where-Object Name -ne 'RELEASE_NOTES.md' | ForEach-Object FullName)
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }

      - name: Verify published asset inventory
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(Get-ChildItem artifacts -File | Where-Object Name -ne 'RELEASE_NOTES.md' | ForEach-Object { [pscustomobject]@{ name = $_.Name; size = [int64]$_.Length } } | Sort-Object name)
          $actual = @((gh release view '${{ inputs.release_tag }}' --repo xrigpc/xrig-releases --json assets --jq '.assets[] | {name: .name, size: .size}' | ConvertFrom-Json) | Sort-Object name)
          if (($expected | ConvertTo-Json -Compress) -ne ($actual | ConvertTo-Json -Compress)) { throw 'Published GitHub Release assets do not match the signed release inventory.' }
